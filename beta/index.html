<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F1C">
<meta name="description" content="TRPGシナリオと分岐ストーリーのフローチャート作成アプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームブック工房">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ゲームブック工房</title>
<style>
:root{
  --bg:#0A0F1C; --bg2:#05080F; --paper:#131E33; --paper2:#111A2E; --ink:#EAF0FF; --ink2:#DCE6F7; --muted:#93A5C4; --faint:#71809E;
  --line:#223354; --line2:#1D2A44; --line3:#33507E;
  --accent:#5EA8FF; --accent-soft:#12294D; --accent-line:#2B5CAB; --accent-ink:#0A0F1C;
  --hi:#FFCE32; --hi-ink:#0A0F1C; --hi-soft:#2B2408; --hi-line:#6B5B14;
  --check:#B3A1FF; --check-soft:#221D42; --end:#F09A82; --end-soft:#3A1F1C; --warn:#FFCE32; --warn-soft:#2B2408; --danger:#FF7A7A;
  --r:12px;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
/* 着せ替え（プレミアム）。色の変数だけを差し替える */
:root[data-theme="sumi"]{--bg:#0E0E10;--bg2:#070708;--paper:#1A1A1E;--paper2:#161619;--ink:#F2EFEA;--ink2:#E2DED7;--muted:#A8A39B;--faint:#7D7871;--line:#2C2B2F;--line2:#232226;--line3:#47444A;--accent:#E8E2D6;--accent-soft:#2A2826;--accent-line:#6E6A62;--hi:#E2483D;--hi-ink:#FFFFFF;--hi-soft:#331614;--hi-line:#7A2A24}
:root[data-theme="mori"]{--bg:#0B1612;--bg2:#06100C;--paper:#13241D;--paper2:#112019;--ink:#E8F5EE;--ink2:#D6EBDF;--muted:#94B5A4;--faint:#6F8F7F;--line:#21392F;--line2:#1B3028;--line3:#2F5444;--accent:#6FD3A6;--accent-soft:#143327;--accent-line:#2E7A58;--hi:#E9C46A;--hi-ink:#0B1612;--hi-soft:#2C2610;--hi-line:#6B5A22}
:root[data-theme="budou"]{--bg:#140D1A;--bg2:#0C0710;--paper:#21162B;--paper2:#1C1325;--ink:#F4ECFA;--ink2:#E6DAF0;--muted:#B19EC2;--faint:#8A789B;--line:#35264A;--line2:#2C1F3E;--line3:#4D3769;--accent:#C9A2FF;--accent-soft:#2D1C47;--accent-line:#6A47A3;--hi:#FF9EC7;--hi-ink:#140D1A;--hi-soft:#3A1828;--hi-line:#7A3D5A}
:root[data-theme="kohaku"]{--bg:#17110A;--bg2:#0E0A05;--paper:#251C12;--paper2:#20180F;--ink:#FBF1E4;--ink2:#EFE2CF;--muted:#C2AB8E;--faint:#958068;--line:#3A2C1C;--line2:#302417;--line3:#5A4329;--accent:#F2B05E;--accent-soft:#38250F;--accent-line:#8A5E26;--hi:#FFE08A;--hi-ink:#17110A;--hi-soft:#33290F;--hi-line:#7A6524}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-text-size-adjust:100%}
/* 画面全体にうっすら方眼と斜めの光。スクロールや地図の移動では動かない */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
 linear-gradient(115deg,transparent 0 58%,rgba(94,168,255,.025) 58% 76%,transparent 76%),
 linear-gradient(rgba(130,160,220,.03) 1px,transparent 1px),
 linear-gradient(90deg,rgba(130,160,220,.03) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px}
#app{position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);font-size:16px}
select option,select optgroup{background:#131E33;color:var(--ink)}
@media (min-width:900px){input,select,textarea{font-size:14px}}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mono{font-family:var(--mono);letter-spacing:.14em}
::selection{background:#2B5CAB}

/* 部品 */
.btn{border:1px solid var(--line3);background:transparent;border-radius:999px;padding:8px 14px;line-height:1.2;white-space:nowrap;color:#C9D6EE}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:800}
.btn.pri:hover{filter:brightness(1.05)}
.btn.blue{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:12px;color:#A9BAD6;font-weight:500}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,168,255,.18)}
textarea.inp{resize:vertical;line-height:1.8}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#93A5C4 50%),linear-gradient(135deg,#93A5C4 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=checkbox]{accent-color:var(--hi);width:16px;height:16px}
.row{display:flex;gap:8px;align-items:center}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);font-weight:600;letter-spacing:.02em}
.tag.start{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);border-radius:3px;letter-spacing:.1em;font-weight:800}
.tag.end{background:var(--end-soft);border-color:#6B3A30;color:var(--end)}
.tag.check{background:var(--check-soft);border-color:#463C80;color:var(--check)}
.tag.cond{background:var(--hi-soft);border-color:var(--hi-line);color:var(--hi)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;line-height:1.8}
.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{padding:7px 9px;display:inline-flex;align-items:center}
.icon-btn .ico{width:16px;height:16px}
.icon-btn:disabled{opacity:.3}
.seg{display:inline-flex;border:1px solid var(--line3);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}

/* ホーム */
.home{max-width:560px;margin:0 auto;padding:26px 22px 40px;width:100%;overflow:auto}
.home .hlabel{font-size:10.5px;color:var(--muted)}
.home .hrow{display:flex;align-items:flex-start;gap:10px}
.home .htitle{font-family:var(--serif);font-size:clamp(24px,8vw,34px);font-weight:600;margin:10px 0 6px;line-height:1.3;letter-spacing:.04em;white-space:nowrap}
.home .hhead{display:flex;align-items:center;gap:10px}
.roundbtn{margin-left:auto;width:36px;height:36px;border:0;background:transparent;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.roundbtn .ico{width:22px;height:22px}
.seclabel.row2{display:flex;align-items:center;gap:10px}
.seclabel.row2 .btn{margin-left:auto;letter-spacing:0;font-family:var(--sans)}
.hguide .rico{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;flex:none}
.hguide .rico .ico{width:18px;height:18px}
.hguide .gt2{display:flex;flex-direction:column;gap:2px}
.hguide .gt2 small{font-size:11.5px;color:var(--muted)}
.sample{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--paper)}
.sample b{font-family:var(--serif);font-size:16px}
.sample p{margin:4px 0 10px;font-size:12px;color:var(--muted);line-height:1.6}
.home .hsub{font-size:12.5px;color:var(--muted);line-height:1.7;margin:4px 0 0}
.home .newbtn{margin-left:auto;flex:none;margin-top:10px}
.seclabel{font-size:10.5px;color:var(--muted);margin:30px 0 4px}
.work{padding:16px 2px;border-bottom:1px solid var(--line2);cursor:pointer}
.work .t{font-family:var(--serif);font-size:20px;font-weight:600}
.work .m{font-size:11px;color:var(--muted);margin-top:6px}
.work .m b{color:var(--hi);font-weight:600}
.work .dots{margin-left:auto;color:var(--muted);font-size:16px;letter-spacing:.1em;border:0;background:none;padding:4px 6px}
.lmeter{height:4px;background:var(--line2);border-radius:2px;margin-top:10px;overflow:hidden}
.lmeter i{display:block;height:100%;background:var(--accent)}
.hguide{padding:16px 2px;border-bottom:1px solid var(--line2);font-size:14.5px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.hguide .ico{width:16px;height:16px;color:var(--accent);flex:none}
.hguide span.go{margin-left:auto;color:var(--accent);font-size:13px}
.hfoot{padding:18px 2px 0;font-size:10.5px;color:var(--faint);line-height:1.7}
.storage-note{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:14px}

/* 編集画面の枠 */
.top{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;flex-shrink:0}
.top .back{border:0;background:none;color:#A9BAD6;font-size:17px;padding:4px 6px}
.top .ptitle{flex:1;min-width:0;border:1px solid transparent;background:transparent;font-family:var(--serif);font-size:17px;font-weight:600;padding:5px 6px;border-radius:8px}
.top .ptitle:focus{border-color:var(--accent-line);outline:none;background:var(--paper)}
.modechip{font-size:11px;padding:5px 10px;border:1px solid var(--line3);border-radius:999px;color:var(--accent);background:none;white-space:nowrap}
.status{font-size:11px;color:var(--faint);white-space:nowrap}
.status.err{color:var(--danger)}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);font-size:10px;color:var(--muted);flex-shrink:0;white-space:nowrap;overflow:hidden}
.hud b{color:var(--hi);font-weight:700}
.hud button{border:0;background:none;padding:0;color:var(--muted);font:inherit;letter-spacing:inherit}
.hud .warnc{color:var(--hi)}
.body{flex:1;min-height:0;display:flex;position:relative}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow:auto;padding:18px 18px 40px}
.wrap{max-width:760px;margin:0 auto}
.bnav{display:flex;border-top:1px solid var(--line2);padding:8px 6px 10px;flex-shrink:0;background:var(--bg)}
.bnav button{flex:1;text-align:center;font-size:10px;color:var(--faint);border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.bnav button .ico{width:19px;height:19px;stroke-width:1.7}
.bnav button.on{color:var(--accent)}
.bnav .cnt{position:absolute;top:-2px;left:calc(50% + 8px);min-width:15px;height:15px;border-radius:8px;background:var(--hi);color:var(--hi-ink);font-size:9px;font-weight:800;line-height:15px;padding:0 4px}
.menu-list{display:flex;flex-direction:column}
.modepills{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.modepills button{flex:1 1 auto;min-width:0;font-size:11.5px;padding:7px 10px;border-radius:999px;border:1px solid var(--line3);background:transparent;color:var(--accent);white-space:nowrap}
.modepills button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--muted);cursor:default;opacity:1}
.menu-list button{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-bottom:1px solid var(--line2);background:none;padding:15px 4px;font-size:14.5px}
.menu-list button:last-child{border-bottom:0}
.menu-list button .ico{width:16px;height:16px;color:var(--accent)}
.menu-list button small{margin-left:auto;color:var(--muted);font-size:12px}
.menu-list button.on small{color:var(--hi)}

/* フローチャート */
.vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:transparent}
.vp.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:#3B82F6;stroke-width:1.5}
.edges path.fail{stroke:#8F6C7E;stroke-dasharray:4 3}
.edges path.back{stroke-opacity:.6}
.edges path.unseen{stroke:#33507E;stroke-dasharray:3 3}
.edges path.hi{stroke:var(--hi);stroke-width:2;stroke-opacity:1}
.edges text.bk{font-size:10px;fill:var(--muted);font-family:var(--sans)}
.edges text.bk.un{fill:#4D5F80}
.edges .mk path{stroke-width:2}
.grp{position:absolute;width:240px;padding:8px 8px 8px;cursor:pointer;user-select:none;-webkit-user-select:none;border:1px solid transparent;border-radius:4px;transition:border-color .15s,background .15s}
.grp:hover{border-color:rgba(94,168,255,.25)}
.grp.sel{border-color:rgba(94,168,255,.6);background:rgba(17,26,46,.55)}
.grp.key{background:rgba(255,206,50,.04)}
.grp.here{box-shadow:0 0 0 2px var(--hi)}
.grp .gt{display:flex;align-items:center;gap:7px;white-space:nowrap;margin-bottom:3px}
.grp .gt .gn{font-family:var(--mono);font-size:10px;background:var(--ink);color:var(--bg);padding:2px 5px;font-weight:700;flex:none}
.grp .gt .gtt{overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink)}
.grp.key .gt .gtt{font-family:var(--serif);font-size:15px;color:var(--hi)}
.grp .gt .tag{font-size:9px;margin-left:auto;flex-shrink:0}
.grp .gpl{font-size:10px;margin:0 0 2px 1px}
.grp .gx{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gx.ng{color:var(--danger)}
.grp.locked .gt .gn{background:#33507E}
.grp.locked .gt .gtt{color:#4D5F80;font-weight:400;letter-spacing:.2em}
.bar{display:flex;align-items:center;gap:6px;min-height:27px;margin-top:5px;padding:5px 8px;background:var(--paper2);border:1px solid #263650;border-left:2px solid var(--accent);border-radius:4px;color:var(--ink2);font-size:10.5px}
.bar .bi{display:flex;color:var(--accent);flex-shrink:0}
.bar .bi .ico{width:11px;height:11px;stroke-width:2.2}
.bar .bl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .ico.sm{width:10px;height:10px;color:var(--muted);margin-left:auto}
.bar.ck{border-left-color:var(--check)}
.bar.ck .bi{color:var(--check)}
.bar.key{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.bar.key .bi,.bar.key .ico.sm{color:var(--hi-ink)}
.bar.unseen{background:transparent;border-style:dashed;border-color:#33507E;color:#4D5F80;letter-spacing:.15em}
.bar.unseen .bi{color:#4D5F80}
.bar .miss{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0}
.endc{height:40px;border-radius:4px;background:var(--end-soft);border:1px solid #6B3A30;color:var(--end);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;letter-spacing:.35em}
.endc.k-true{background:#2B2408;border-color:#6B5B14;color:var(--hi)}
.endc.k-good{background:#0F2A2A;border-color:#1F5C55;color:#7FE0C8}
.endc.k-normal{background:#182238;border-color:#33507E;color:#A9BAD6}
.endc.k-bad{background:var(--end-soft);border-color:#6B3A30;color:var(--end)}
.grp.locked .endc{background:transparent;border-style:dashed;border-color:#33507E;color:#4D5F80}
.chap{position:absolute;border:1px solid rgba(130,160,220,.08);pointer-events:none}
.chap i{position:absolute;width:14px;height:14px;border:0 solid var(--hi)}
.chap i.tl{left:-1px;top:-1px;border-top-width:2px;border-left-width:2px}
.chap i.tr{right:-1px;top:-1px;border-top-width:2px;border-right-width:2px}
.chap i.bl{left:-1px;bottom:-1px;border-bottom-width:2px;border-left-width:2px}
.chap i.br{right:-1px;bottom:-1px;border-bottom-width:2px;border-right-width:2px}
.chap .ct{position:absolute;top:-22px;left:4px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.chap .ct b{font-family:var(--sans);color:var(--ink);font-size:12px;margin-left:6px;letter-spacing:.08em}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;margin-right:4px}
.grp.dim{opacity:.22}
.zoomlbl{position:absolute;left:14px;bottom:18px;font-family:var(--mono);letter-spacing:.14em;font-size:10px;color:var(--muted);border:1px solid #263650;border-radius:4px;padding:4px 8px;background:rgba(10,15,28,.85);z-index:3}
.fab{position:absolute;right:16px;bottom:14px;z-index:3;width:54px;height:54px;border-radius:50%;background:var(--hi);color:var(--hi-ink);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.fab .ico{width:24px;height:24px;stroke-width:2}
.mtool{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line2);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.mtool .sp{flex:1}
.mtool .zoombtns{display:none;gap:6px;align-items:center}
@media (min-width:900px){.mtool .zoombtns{display:flex}}
.legend{position:absolute;right:12px;top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto auto;gap:8px 18px;font-size:12px;color:var(--ink2);z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.legend div{display:flex;align-items:center;gap:8px}
.legend .sw{width:24px;height:14px;border-radius:3px;font-size:9px;display:flex;align-items:center;justify-content:center}
.legend .ico{color:var(--accent)}
.nexthint{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.7;color:var(--ink2);margin-bottom:14px}
.nexthint b{display:block;font-size:11.5px;color:var(--accent);margin-bottom:2px}

/* シーン編集 */
.panel{width:420px;flex-shrink:0;border-left:1px solid var(--line2);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.panel .pb{flex:1;overflow:auto;padding:14px 20px 30px}
@media (max-width:899px){
  .panel{position:fixed;left:0;right:0;top:0;bottom:0;width:auto;border-left:0;z-index:30;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .scrim{display:none}
}
.edlabel{font-size:10.5px;color:var(--muted)}
.edtitle{font-size:26px;font-weight:800;margin:6px 0 10px;line-height:1.3;word-break:break-all}
.edtitle.key{font-family:var(--serif);color:var(--hi)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.typechip{font-size:11.5px;color:var(--muted);border:1px solid var(--line3);background:transparent;border-radius:999px;padding:6px 13px}
.typechip.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.flabel{font-size:12px;color:#A9BAD6;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.flabel .hint{margin-left:auto}
.panel .inp.ttl{font-size:16px}
.panel textarea.body{font-size:14px;line-height:1.9;min-height:120px}

    else if(k==='style') el.style.cssText=v;
    else if(k==='value') val=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  if(val!==undefined) el.value=val;
  return el;
}

const LS_KEY='gamebook-kobo.projects.v1';

const IDB={
  db:null,
  open(){ return new Promise((res,rej)=>{
    if(!('indexedDB' in window)) return rej(new Error('no idb'));
    const r=indexedDB.open('gamebook-kobo',1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('projects')) r.result.createObjectStore('projects',{keyPath:'id'}); };
    r.onsuccess=()=>{ this.db=r.result; res(); };
    r.onerror=()=>rej(r.error);
  }); },
  req(mode,fn){ return new Promise((res,rej)=>{ const st=this.db.transaction('projects',mode).objectStore('projects'); const q=fn(st); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  all(){ return this.req('readonly',s=>s.getAll()); },
  put(p){ return this.req('readwrite',s=>s.put(p)); },
  del(id){ return this.req('readwrite',s=>s.delete(id)); }
};

const Backup={
  KEY:'gamebook-kobo.backup-names.v1', timers:{},

  fileName(p){ return String(p.title||'無題').replace(/[\\/:*?"<>|\n\r\t]+/g,'_').trim().slice(0,40)+'_'+String(p.id).slice(-4)+'.json'; },
  save(p){ if(!NATIVE) return; clearTimeout(this.timers[p.id]); this.timers[p.id]=setTimeout(()=>this.write(clone(p)),1500); },

      if(map[p.id]&&map[p.id]!==name){ try{ await Filesystem.deleteFile({path:map[p.id],directory:'DOCUMENTS'}); }catch(e){} }

    }catch(e){}
  }

const Store={
  mode:'local', timers:{},
  async init(){
    try{
      await IDB.open(); this.mode='idb';
      // 以前 localStorage に入っていた分を一度だけ移す
      const old=Object.values(lsAll());
      for(const p of old) await IDB.put(p);
      if(old.length) try{ localStorage.removeItem(LS_KEY); }catch(e){}
    }catch(e){ this.mode='local'; }
    try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  },
  async list(){
    if(this.mode==='idb'){ try{ return await IDB.all(); }catch(e){} }
    return Object.values(lsAll());
  },
  save(p,now){
    p.updated=Date.now(); setStatus('保存中…');
    clearTimeout(this.timers[p.id]);
    this.timers[p.id]=setTimeout(()=>this.flush(p), now?0:400);
    Backup.save(p);
  },
  async flush(p){
    const data=clone(p);
    if(this.mode==='idb'){
      try{ await IDB.put(data); setStatus('この端末に保存済み'); if(!this.quiet) Cloud.queue(p); return; }
      catch(e){ /* 下の localStorage に落とす */ }
    }
    setStatus(lsPut(data)?'この端末に保存済み':'保存できませんでした（容量がいっぱいかもしれません）', !lsAll()[p.id]); if(!this.quiet) Cloud.queue(p);
  },
  async remove(id){ if(this.mode==='idb'){ try{ await IDB.del(id); }catch(e){} } lsDel(id); }
};

function rollDice(expr){
  const s=String(expr||'').replace(/\s/g,'').toLowerCase().replace(/[ｄＤ]/g,'d').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  if(!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) return null;
  let total=0; const parts=[]; const re=/([+-]?)(\d*d\d+|\d+)/g; let m;
  while((m=re.exec(s))){
    const sg=m[1]==='-'?-1:1;
    if(m[2].includes('d')){
      let [n,f]=m[2].split('d'); n=+(n||1); f=+f; if(n<1||n>100||f<1) return null;

}

}

const GUIDE_KEY='gamebook-kobo.guide.v1';
/* ---------- 通しチェック：遊ぶ人が詰まらないか ----------
   条件に使われている値だけを状態として持ち、選べる選択肢を全部たどる。
   値は「条件に出てくる数字の範囲 ±1」に丸めるので、条件の結果は変わらないまま組み合わせが小さくなる。
   判定（ダイス）は成功・失敗どちらにも進めるものとして扱う。 */
function deepCheck(limit){
  const p=P(); limit=limit||40000;
  const keys=[]; const rng={};
  const note=(k,v)=>{ if(!rng[k]){ rng[k]={lo:0,hi:1}; keys.push(k); } const r=rng[k]; if(!isNaN(v)){ r.lo=Math.min(r.lo,v); r.hi=Math.max(r.hi,v); } };
  for(const n of p.nodes) for(const c of n.choices) for(const x of c.conds){ if(!refOf(x.var)) continue; note(x.var, NOVAL.includes(x.op)?1:+x.val); }
  keys.forEach(k=>{ rng[k].lo-=1; rng[k].hi+=1; });
  const clamp=(k,v)=>Math.max(rng[k].lo,Math.min(rng[k].hi,+v||0));
  const fresh=()=>{ const vals={}; for(const v of p.vars) vals[v.id]=+v.init||0; return vals; };
  const pack=(vals)=>{ const o={}; for(const k of keys) o[k]=clamp(k,vals[k]); return o; };
  const sk=(id,vals)=>id+'|'+keys.map(k=>vals[k]).join(',');
  const enterVals=(id,vals)=>{ const n=nodeById(id); const v={...vals}; if(!n) return v;
    if(n.place) v['pl:'+n.place]=(+v['pl:'+n.place]||0)+1; for(const e of n.effects) applyEff(e,v); return pack(v); };
  const st=new Map(); const order=[]; const succ=new Map(); const okChoice=new Set();
  const startVals=enterVals(p.startId,pack(fresh()));
  if(!nodeById(p.startId)) return {empty:true};
  const k0=sk(p.startId,startVals); st.set(k0,{id:p.startId,vals:startVals,prev:null,via:''}); order.push(k0);
  let capped=false;
  for(let i=0;i<order.length;i++){
    const k=order[i]; const s=st.get(k); const n=nodeById(s.id); const out=[]; succ.set(k,out);
    if(!n||n.type==='ending') continue;
    for(const c of n.choices){
      if(!c.conds.every(x=>evalCond(x,s.vals))) continue;
      okChoice.add(c.id);
      const after={...s.vals}; for(const e of c.effects) applyEff(e,after);
      for(const t of new Set(targetsOf(c).filter(Boolean))){
        if(!nodeById(t)) continue;
        const nv=enterVals(t,pack(after)); const nk=sk(t,nv); out.push({k:nk,c:c.id});
        if(!st.has(nk)){ if(st.size>=limit){ capped=true; continue; } st.set(nk,{id:t,vals:nv,prev:k,via:c.label||'（無題の選択肢）'}); order.push(nk); }
      }
    }
  }
  // エンディングにたどり着ける状態を逆向きに集める
  const pred=new Map(); for(const [k,out] of succ) for(const {k:t} of out){ if(!pred.has(t)) pred.set(t,[]); pred.get(t).push(k); }
  const good=new Set(); const q=[];
  for(const [k,s] of st){ const n=nodeById(s.id); if(n&&n.type==='ending'){ good.add(k); q.push(k); } }
  while(q.length){ const k=q.pop(); for(const pk of pred.get(k)||[]) if(!good.has(pk)){ good.add(pk); q.push(pk); } }
  const path=(k)=>{ const steps=[]; let cur=k; while(cur){ const s=st.get(cur); steps.unshift({id:s.id,via:s.via}); cur=s.prev; } return steps; };
  // 詰みが決まる選択：エンディングに行ける状態から、行けない状態へ移る選択肢
  const trap=new Map(); // 選択肢ID → 最短の例
  if(!capped) for(const k of order){ if(!good.has(k)) continue; const s=st.get(k);
    for(const e of succ.get(k)||[]){ if(good.has(e.k)||!st.has(e.k)||trap.has(e.c)) continue;
      const n=nodeById(s.id); const c=n.choices.find(x=>x.id===e.c); trap.set(e.c,{id:s.id,label:c?c.label:'',path:path(e.k),dead:!(succ.get(e.k)||[]).length}); } }
  const stuck=[...trap.values()];
  const startStuck=!capped&&!good.has(k0);
  const reachedNodes=new Set([...st.values()].map(s=>s.id));
  const endsAll=p.nodes.filter(n=>n.type==='ending');
  const endsMissed=endsAll.filter(n=>!reachedNodes.has(n.id));
  const neverChoices=[]; for(const n of p.nodes){ if(!reachedNodes.has(n.id)||n.type==='ending') continue; n.choices.forEach((c,i)=>{ if(!okChoice.has(c.id)) neverChoices.push({n,c,i}); }); }
  return {states:st.size,capped,stuck,startStuck,endsAll,endsMissed,neverChoices};
}

  const parts=steps.map((s,i)=>(i?`「${s.via}」→ `:'')+(nodeById(s.id)?.title||'無題'));
  if(parts.length>9) return [...parts.slice(0,3),'…',...parts.slice(-5)].join('　');
  return parts.join('　');
}

  const seen=p.seen||{n:{}}; const sn=seen.n||{};

  return {ends:ends.length,got:ends.filter(n=>sn[n.id]).length,pct:p.nodes.length?Math.round(p.nodes.filter(n=>sn[n.id]).length/p.nodes.length*100):0};
}

/* ---------- シナリオのひな形（骨組みだけ。本文はメモで「何を書くか」を案内） ---------- */
const SKELETONS={
  trpg:[['empty','白紙から','開始シーンだけ'],['closed','クローズド探索','導入→3か所を探索→真相→脱出／ロスト'],['taiman','タイマン','導入→NPCと交流→事件→選択→2つのエンド'],['city','シティ','導入→4か所で情報収集→合流→対決→エンド']],
  game:[['empty','白紙から','最初の場面だけ'],['romance3','恋愛・3ルート','共通ルート→好感度で分岐→3人それぞれのエンド'],['mystery','推理もの','調査→手がかり3つ→推理→正解／不正解']]
};
function buildSkeleton(kind,title,mode){
  const p=newProject(title); p.mode=mode; if(kind==='empty') return p;
  const V=mkV(p), N=mkN, C=mkC; const go=(a,label,b,extra)=>a.choices.push(C(Object.assign({label,to:b.id},extra||{})));
  const chk=(a,label,target,ok,ng)=>a.choices.push(C({label,kind:'check',dice:'1d100',cmp:'<=',target,okTo:ok.id,ngTo:ng.id,icon:'search'}));
  let nodes=[];
  if(kind==='closed'){
    const san=V('SAN','num',50,'正気度',99); const clue=V('手がかり','num',0,'見つけた手がかりの数'); V('目星','num',50,'探索技能');
    const intro=N('導入','scene','（探索者たちが閉じ込められるまでを書く）','何が起きて、なぜ出られないのか。最初に提示する謎を決める。');
    const hub=N('探索拠点','scene','（いる場所の様子と、調べられる所を書く）','ここから3か所に行ける。手がかりが3つそろうと真相へ。');
    const rooms=['探索場所A','探索場所B','探索場所C'].map(t=>N(t,'scene','（部屋の描写）','調べると手がかりが1つ見つかる。判定に失敗したら情報を減らすか、SANを減らす。'));
    const fails=rooms.map(r=>N(r.title+'（失敗）','scene','（見落とした・怖いものを見た描写）'));
    const truth=N('真相','scene','（真相が明らかになる場面）','ここで脱出の方法がわかる。');
    const esc=N('脱出','ending','（生還したエンディング）'); const lost=N('ロスト','ending','（帰れなかったエンディング）');
    go(intro,'あたりを調べ始める',hub);
    rooms.forEach((r,i)=>{ const got=N(r.title+'：手がかり','scene','（見つけた手がかりの内容）'); got.effects.push({var:clue,op:'add',val:'1'}); go(hub,r.title+'へ行く',r); chk(r,'調べる','目星',got,fails[i]); go(got,'拠点にもどる',hub); go(fails[i],'拠点にもどる',hub); fails[i].effects.push({var:san,op:'sub',val:'1'}); nodes.push(got); });

/* パネルを閉じたとき（スマホ）：閉じた場面と、そこからつながる場面が画面に入るように寄せる */
function showAround(id){
  const n=nodeById(id); if(!n||!vpEl||!vpEl.isConnected) return; const r=vpEl.getBoundingClientRect();
  const ns=[n,...n.choices.flatMap(targetsOf).map(nodeById).filter(Boolean)];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const m of ns){ x0=Math.min(x0,m.x); y0=Math.min(y0,m.y); x1=Math.max(x1,m.x+GW); y1=Math.max(y1,m.y+nodeH(m)); }
  const z=Math.max(0.8,Math.min(1,(r.width-40)/(x1-x0),(r.height-140)/(y1-y0))); /* 文字が読める大きさは保つ。右にはみ出す先の場面は、続きがあると分かる程度に見せる */
  S.cam.z=z; S.cam.x=Math.max(20-x0*z,(r.width-(x1-x0)*z)/2-x0*z); S.cam.y=Math.min(r.height*0.3,70+Math.max(0,(r.height-140-(y1-y0)*z)/2))-y0*z; applyCam();
}
function selectNode(id){

const GW=240, COLW=GW+120;
function addNode(type,near){
  const p=P(); const base=near?nodeById(near):null; let x,y;
  if(base){
    x=base.x+COLW; y=base.y; const est=type==='ending'?106:90;
    for(let guard=0;guard<60;guard++){
      const hit=p.nodes.find(n=>Math.abs(n.x-x)<GW&&n.y<y+est+20&&n.y+nodeH(n)+20>y);
      if(!hit) break; y=hit.y+nodeH(hit)+30;
    }
  }
  else if(p.nodes.length){ /* 選んでいる場面がないときは、いちばん下の空いている場所に置く */ x=Math.min(...p.nodes.map(n=>n.x)); y=Math.max(...p.nodes.map(n=>n.y+nodeH(n)))+70; }
  else { x=0; y=0; }
  const n={id:rid('n'),title:type==='ending'?'エンディング':'新しいシーン',type,x:Math.round(x),y:Math.round(y),text:'',gm:'',effects:[],choices:[],chapter:base?base.chapter||'':'',endKind:''};
  p.nodes.push(n); if(!nodeById(p.startId)) p.startId=n.id; changed({map:false}); return n;
}

function elbow(x1,y1,xm,y2,x2){
  const dy=y2-y1; if(Math.abs(dy)<1) return `M${x1} ${y1} H${x2}`;
  const r=Math.min(7,Math.abs(dy)/2,xm-x1,x2-xm), s=dy>0?1:-1;
  return `M${x1} ${y1} H${xm-r} Q${xm} ${y1} ${xm} ${y1+s*r} V${y2-s*r} Q${xm} ${y2} ${xm+r} ${y2} H${x2}`;
}

function zoomAt(f,cx,cy){
  const z=Math.min(2.2,Math.max(0.2,S.cam.z*f)); const k=z/S.cam.z;
  S.cam.x=cx-(cx-S.cam.x)*k; S.cam.y=cy-(cy-S.cam.y)*k; S.cam.z=z; applyCam();
}
function zoomBy(f){ if(!vpEl) return; const r=vpEl.getBoundingClientRect(); zoomAt(f,r.width/2,r.height/2); }
function nodeH(n){ const el=worldEl&&worldEl.querySelector(`[data-id="${n.id}"]`); if(el&&el.offsetHeight) return el.offsetHeight; return n.type==='ending'?106:46+(n.text?16:0)+Math.max(1,n.choices.length)*29; }

function bindViewport(){
  const pts=new Map(); let drag=null, pinch=null;
  vpEl.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    if(e.target.closest('.legend,.fab,.nexthint,button')) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{ vpEl.setPointerCapture(e.pointerId); }catch(_){}
    if(pts.size===2){
      const [a,b]=[...pts.values()]; const r=vpEl.getBoundingClientRect();
      pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2-r.left,cy:(a.y+b.y)/2-r.top};
      if(drag&&drag.node&&drag.moved) changed({map:false});
      drag=null; return;
    }
    const nodeEl=e.target.closest('.grp');
    if(nodeEl&&!S.pv){ const n=nodeById(nodeEl.dataset.id); drag={node:n,el:nodeEl,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,moved:false}; }
    else { drag={pan:true,sx:e.clientX,sy:e.clientY,ox:S.cam.x,oy:S.cam.y,moved:false}; vpEl.classList.add('panning'); }
  });
  vpEl.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size===2){
      const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const r=vpEl.getBoundingClientRect();
      const cx=(a.x+b.x)/2-r.left, cy=(a.y+b.y)/2-r.top;
      S.cam.x+=cx-pinch.cx; S.cam.y+=cy-pinch.cy; zoomAt(d/pinch.d,cx,cy); pinch={d,cx,cy}; return;
    }
    if(!drag) return;
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<5) return; drag.moved=true;
    if(drag.pan){ S.cam.x=drag.ox+dx; S.cam.y=drag.oy+dy; applyCam(); }
    else { drag.node.x=Math.round(drag.ox+dx/S.cam.z); drag.node.y=Math.round(drag.oy+dy/S.cam.z); drag.el.style.left=drag.node.x+'px'; drag.el.style.top=drag.node.y+'px'; drawEdges(); }
  });
  const end=e=>{
    pts.delete(e.pointerId); if(pts.size<2) pinch=null;
    vpEl.classList.remove('panning');
    if(!drag) return;
    if(drag.node){ if(drag.moved) changed({map:false}); else selectNode(drag.node.id); }
    else if(!drag.moved&&e.type==='pointerup'&&S.sel) selectNode(null);
    drag=null;
  };
  vpEl.addEventListener('pointerup',end); vpEl.addEventListener('pointercancel',end);
  vpEl.addEventListener('wheel',e=>{
    e.preventDefault(); const r=vpEl.getBoundingClientRect();
    if(e.ctrlKey||e.metaKey) zoomAt(Math.exp(-e.deltaY*0.01),e.clientX-r.left,e.clientY-r.top);
    else { S.cam.x-=e.deltaX; S.cam.y-=e.deltaY; applyCam(); }
  },{passive:false});
}
/* 左から右へ流れる配置（開始シーンからの深さで列を分ける。章があれば章ごとにまとまりを作る） */
function autoLayout(){
  const p=P(); const depth={}; const order=[]; const q=[];
  if(nodeById(p.startId)){ depth[p.startId]=0; q.push(p.startId); }
  while(q.length){ const id=q.shift(); order.push(id); const n=nodeById(id); for(const c of n.choices) for(const t of targetsOf(c)) if(t&&nodeById(t)&&depth[t]===undefined){ depth[t]=depth[id]+1; q.push(t); } }
  const GY=44;
  const placeCols=(cols,x0)=>{ cols.forEach((arr,ci)=>{ const H=arr.reduce((a,n)=>a+nodeH(n),0)+GY*(arr.length-1); let y=-H/2; for(const n of arr){ n.x=Math.round(x0+ci*COLW); n.y=Math.round(y); y+=nodeH(n)+GY; } }); return x0+cols.length*COLW; };
  const colsOf=(ns)=>{
    const reach=ns.filter(n=>depth[n.id]!==undefined).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
    const base=reach.length?Math.min(...reach.map(n=>depth[n.id])):0; const cols=[];
    for(const n of reach){ const c=depth[n.id]-base; (cols[c]=cols[c]||[]).push(n); }
    const out=cols.filter(Boolean); const rest=ns.filter(n=>depth[n.id]===undefined);
    for(let i=0;i<rest.length;i+=5) out.push(rest.slice(i,i+5));
    return out;
  };
  const key=n=>p.chapters.some(c=>c.id===n.chapter)?n.chapter:'';
  if(!p.nodes.some(key)){ placeCols(colsOf(p.nodes),0); return; }
  const minD=ns=>{ const d=ns.map(n=>depth[n.id]).filter(x=>x!==undefined); return d.length?Math.min(...d):1e9; };
  const groups=p.chapters.map(c=>({ns:p.nodes.filter(n=>n.chapter===c.id)})).filter(g=>g.ns.length);
  const free=p.nodes.filter(n=>!key(n));
  if(free.length){ const m=minD(free); let at=groups.findIndex(g=>minD(g.ns)>m); if(at<0) at=groups.length; groups.splice(at,0,{ns:free}); }
  let x=0; for(const g of groups){ x=placeCols(colsOf(g.ns),x)+60; }
}

/* ---------- play ---------- */
function startPlay(from){
  const p=P(); const vals={}; for(const v of p.vars) vals[v.id]=+v.init||0;
  S.play={cur:from||p.startId,vals,hist:[],trail:[],roll:null,got:[],newEnd:false};
  enter(S.play.cur);
}
function enter(id){
  const pl=S.play; pl.cur=id; pl.trail.push(id); pl.got=[];
  const n=nodeById(id); if(!n){ pl.newEnd=false; return; }
  const seen=ensureSeen(); pl.newEnd=n.type==='ending'&&!seen.n[id];
  seen.n[id]=1; Store.save(P());
  if(n.place) pl.vals['pl:'+n.place]=(+pl.vals['pl:'+n.place]||0)+1;
  for(const e of n.effects){ applyEff(e,pl.vals); if(varById(e.var)) pl.got.push(fmtEff(e)); }
}
function choose(c){
  const pl=S.play;
  pl.hist.push({cur:pl.cur,vals:{...pl.vals},roll:pl.roll,tl:pl.trail.length,got:pl.got,newEnd:pl.newEnd});
  ensureSeen().c[c.id]=1;
  const used=c.effects.filter(e=>varById(e.var)).map(fmtEff);
  for(const e of c.effects) applyEff(e,pl.vals);
  if(c.kind==='check'){
    const r=rollDice(c.dice); const t=resolveTarget(c.target,pl.vals);
    if(!r||isNaN(t)){ pl.roll={label:c.label,err:true}; pl.hist.pop(); renderPlayKeep(); return; }
    const le=c.cmp==='<=';
    let ok=le?r.total<=t:r.total>=t, special='';
    if(c.cf){
      const cv=+c.critVal, fv=+c.fumVal;
      if(c.critVal!==''&&!isNaN(cv)&&(le?r.total<=cv:r.total>=cv)){ ok=true; special='crit'; }
      else if(c.fumVal!==''&&!isNaN(fv)&&(le?r.total>=fv:r.total<=fv)){ ok=false; special='fum'; }
    }
    pl.roll={label:c.label,dice:c.dice,total:r.total,detail:r.detail,cmp:c.cmp,target:t,tname:isNaN(+c.target)?c.target:'',ok,special};
    const dest=special==='crit'?(c.critTo||c.okTo):special==='fum'?(c.fumTo||c.ngTo):(ok?c.okTo:c.ngTo);
    enter(dest);
  }else{ pl.roll=null; enter(c.to); }
  pl.got=[...used,...pl.got];
  renderPlayKeep();
}
function playBack(){ const pl=S.play; const s=pl.hist.pop(); if(!s) return; pl.cur=s.cur; pl.vals=s.vals; pl.roll=s.roll; pl.trail.length=s.tl; pl.got=s.got||[]; pl.newEnd=s.newEnd||false; render(); }
function renderPlayKeep(){ render(); const s2=document.querySelector('.scroll'); if(s2) s2.scrollTop=0; }
function interp(t,vals){ return String(t||'').replace(/\{([^{}]+)\}/g,(m,k)=>{ const v=P().vars.find(x=>x.name===k); if(!v) return m; return v.type==='flag'?(vals[v.id]?'ON':'OFF'):vals[v.id]; }); }
function endingStats(){ const p=P(); const seen=ensureSeen(); const ends=p.nodes.filter(n=>n.type==='ending'); return {ends,got:ends.filter(n=>seen.n[n.id]).length}; }
function showEndings(){
  const {ends,got}=endingStats(); const seen=ensureSeen();
  modal(`エンディング回収 ${got} / ${ends.length}`,
    ends.length?h('div',{class:'endgrid'},ends.map(n=>{ const ok=seen.n[n.id];
      return h('div',{class:'endcard'+(ok?'':' lock')},
        ok&&n.endKind?h('span',{class:'tag k-'+n.endKind},END_KINDS[n.endKind]):h('span',{class:'tag'},ok?'END':'未回収'),
        h('b',{},ok?(n.title||'無題'):'？？？'),
        ok?h('span',{class:'hint'},(n.text||'').slice(0,40)):h('span',{class:'hint'},'まだ見ていないエンディング'));
    })):h('p',{class:'hint'},'エンディングの場面がまだありません。'),
    [{label:'閉じる',cls:'pri'}]);
}
function playerState(vals){
  const p=P(); const meters=p.vars.filter(v=>v.type==='num'&&v.meter);
  const items=p.vars.filter(v=>v.type==='item'&&+vals[v.id]>0);
  const skills=p.vars.filter(v=>v.type==='skill');
  return {meters,items,skills};
}
function meterEl(v,vals){ const mx=Math.max(1,+v.max||10); const val=+vals[v.id]||0; const pct=Math.max(0,Math.min(100,val/mx*100));
  return h('div',{class:'meter'},h('div',{class:'mt'},h('span',{},vLabel(v)),h('span',{},`${val} / ${mx}`)),h('div',{class:'mb'},h('i',{style:`width:${pct}%`}))); }
function renderPlay(body){
  const pl=S.play; const p=P(); const n=nodeById(pl.cur); const g=isGame();

/* ---------- 遊べる形で書き出し（単体HTMLプレイヤー） ----------
   GB_PLAYER は書き出したHTMLの中だけで動く。アプリ側の関数や変数には頼らないこと。 */
function GB_PLAYER(){
  const D=window.GB_DATA, O=window.GB_OPT||{};
  const app=document.getElementById('app');
  const SK='gamebook-kobo.play.'+D.id;
  const END_KINDS={true:'トゥルー',good:'グッド',normal:'ノーマル',bad:'バッド'};
  const GAME=D.mode==='game';
  function h(t,p,...k){ const e=document.createElement(t);
    if(p) for(const a in p){ const v=p[a]; if(v==null||v===false) continue;
      if(a==='class') e.className=v; else if(a.startsWith('on')) e.addEventListener(a.slice(2),v); else if(a==='style') e.style.cssText=v; else e.setAttribute(a,v===true?'':v); }
    for(const c of k.flat(9)){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
    return e; }
  const node=id=>D.nodes.find(n=>n.id===id);
  const vById=id=>D.vars.find(v=>v.id===id);
  const plById=id=>(D.places||[]).find(x=>x.id===id);
  function refOf(k){ k=String(k||''); if(k.startsWith('pl:')){ const p=plById(k.slice(3)); return p?{name:p.name||'場所',type:'place'}:null; } const v=vById(k); return v?{name:v.name,type:v.type}:null; }
  function fmtCond(c){
    const v=refOf(c.var); const nm=v?v.name:'？'; const t=v?v.type:'num';
    if(t==='place') return c.op==='visited'?`${nm}に行ったことがある`:c.op==='notvisited'?`${nm}に行ったことがない`:`${nm}に${c.val}回以上行った`;
    if(c.op==='on') return `${nm}がON`; if(c.op==='off') return `${nm}がOFF`;
    if(t==='item') return c.op==='has'?`${nm}を持っている`:c.op==='none'?`${nm}を持っていない`:`${nm}を${c.val}個以上`;
    if(t==='skill') return c.op==='has'?`${nm}が使える`:c.op==='none'?`${nm}が使えない`:`${nm}の残り${c.val}回以上`;
    return `${nm} ${({'>=':'≧','<=':'≦','==':'＝','!=':'≠','>':'＞','<':'＜'})[c.op]||c.op} ${c.val}`;
  }
  function fmtEff(e){
    const v=vById(e.var); if(!v) return ''; const nm=v.name; const t=v.type;
    if(e.op==='on') return t==='flag'?'':`${nm}をON`; if(e.op==='off') return '';
    if(t==='item') return ({add:`${nm}を${e.val}個手に入れた`,sub:`${nm}を${e.val}個使った`,set:`${nm}が${e.val}個になった`})[e.op]||'';
    if(t==='skill') return ({sub:`${nm}を使った（−${e.val}）`,set:`${nm}を覚えた（${e.val}回）`,add:`${nm}の回数＋${e.val}`})[e.op]||'';
    if(t==='num'&&v.meter) return ({set:`${nm}が${e.val}になった`,add:`${nm}＋${e.val}`,sub:`${nm}−${e.val}`})[e.op]||'';
    return '';
  }
  function resolveTarget(t,vals){ const s=String(t??'').trim(); if(s==='') return NaN; if(!isNaN(+s)) return +s; const v=D.vars.find(x=>x.name===s); return v?+vals[v.id]:NaN; }
  function rollDice(expr){
    const s=String(expr||'').replace(/\s/g,'').toLowerCase().replace(/[ｄＤ]/g,'d').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
    if(!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) return null;
    let total=0; const parts=[]; const re=/([+-]?)(\d*d\d+|\d+)/g; let m;
    while((m=re.exec(s))){ const sg=m[1]==='-'?-1:1;
      if(m[2].includes('d')){ let [n,f]=m[2].split('d'); n=+(n||1); f=+f; if(n<1||n>100||f<1) return null;
        const rs=[]; for(let i=0;i<n;i++) rs.push(1+Math.floor(Math.random()*f)); total+=sg*rs.reduce((a,b)=>a+b,0); parts.push((sg<0?'−':'')+'['+rs.join(',')+']'); }
      else{ total+=sg*(+m[2]); parts.push((sg<0?'−':'+')+m[2]); } }
    return {total,detail:parts.join(' ')};
  }
  function evalCond(c,vals){ if(!refOf(c.var)) return false; const x=+(vals[c.var]||0), y=+c.val;
    switch(c.op){case 'visited':case 'has':return x>=1; case 'notvisited':case 'none':return x<=0; case 'on':return x!==0; case 'off':return x===0; case '==':return x===y; case '!=':return x!==y; case '>=':return x>=y; case '<=':return x<=y; case '>':return x>y; case '<':return x<y;}
    return false; }
  function applyEff(e,vals){ if(!vById(e.var)) return; const n=+e.val||0;
    if(e.op==='set') vals[e.var]=n; else if(e.op==='add') vals[e.var]=(+vals[e.var]||0)+n; else if(e.op==='sub') vals[e.var]=(+vals[e.var]||0)-n; else if(e.op==='on') vals[e.var]=1; else if(e.op==='off') vals[e.var]=0; }
  function interp(t,vals){ return String(t||'').replace(/\{([^{}]+)\}/g,(m,k)=>{ const v=D.vars.find(x=>x.name===k); if(!v) return m; return v.type==='flag'?(vals[v.id]?'ON':'OFF'):vals[v.id]; }); }
  /* 保存（このブラウザの中だけ） */
  function load(){ try{ return JSON.parse(localStorage.getItem(SK)||'{}')||{}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(SK,JSON.stringify(M)); }catch(e){} }
  const M=load(); M.ends=M.ends||{};

  function enter(id){ G.cur=id; G.got=[]; const n=node(id); if(!n){ G.newEnd=false; return; }

    if(n.place) G.vals['pl:'+n.place]=(+G.vals['pl:'+n.place]||0)+1;
    for(const e of n.effects||[]){ applyEff(e,G.vals); const s=fmtEff(e); if(s) G.got.push(s); }

      G.roll={label:c.label,dice:c.dice,total:r.total,detail:r.detail,cmp:c.cmp,target:t,ok,sp};
      enter(sp==='crit'?(c.critTo||c.okTo):sp==='fum'?(c.fumTo||c.ngTo):(ok?c.okTo:c.ngTo));
    }else{ G.roll=null; enter(c.to); }
    G.got=[...used,...G.got];
    showScene(true);

          !ok&&O.why?h('span',{class:'why'},(c.conds||[]).filter(x=>!evalCond(x,G.vals)).map(fmtCond).join('、')):null); }))
        :h('div',{class:'end'},h('p',{class:'muted'},'ここから先へ進む道が見つかりません。'),h('button',{class:'btn',onclick:showTitle},'タイトルへ'));
    }
    app.append(bar,h('div',{class:'page'},state,roll,got,
      pl?h('div',{class:'place'},pl.name):null,
      h('h2',{},n.key?`『${n.title||''}』`:(n.title||'')),
      h('div',{class:'text'},interp(n.text,G.vals)),
      foot));
    if(top) window.scrollTo(0,0);

}

/* ---------- export ---------- */
function toMarkdown(){
  const p=P(); const L=[]; const g=isGame();
  L.push(`# ${p.title}`,''); { const m=scenarioMeta(); const inf=[g?null:['システム',m.system],[g?'対象・ジャンル':'推奨人数',m.players],[g?'プレイ時間':'想定時間',m.time],['注意事項',m.warn]].filter(x=>x&&x[1]); if(inf.length){ inf.forEach(([k,v])=>L.push(`- **${k}**：${v}`)); L.push(''); } if(m.summary) L.push(`## ${g?'あらすじ':'概要'}`,m.summary,''); if(m.credit) L.push(`*${m.credit.replace(/\n/g,' ')}*`,''); }
  for(const t of varTypes()){ const vs=p.vars.filter(v=>v.type===t); if(!vs.length) continue;
    L.push(`## ${typeName(t)}`);
    for(const v of vs) L.push(`- ${v.name}（${t==='flag'?'最初は'+(+v.init?'ON':'OFF'):t==='item'?'最初 '+v.init+'個':t==='skill'?'最初 '+v.init+'回':'初期値 '+v.init+(v.meter?`／最大 ${v.max}`:'')}）${v.memo?'：'+v.memo:''}`);
    L.push(''); }
  if(p.places.length){ L.push('## 場所'); for(const x of p.places) L.push(`- **${x.name}**${x.memo?'：'+x.memo.replace(/\n/g,' '):''}`); L.push(''); }
  if(p.npcs.length){ L.push('## 登場人物'); for(const c of p.npcs) L.push(`- **${c.name}**${c.role?`（${c.role}）`:''}${c.memo?'：'+c.memo.replace(/\n/g,' '):''}`); L.push(''); }
  if(!g&&p.handouts.length){ L.push('## ハンドアウト'); for(const x of p.handouts){ L.push(`### ${x.title||'無題'}${x.to?`（${x.to}）`:''}`); if(x.when) L.push(`*渡すタイミング：${x.when}*`); if(x.body) L.push('',x.body); L.push(''); } }
  const {reach,rest}=orderedNodes(); const ordered=[...reach,...rest];
  const scene=(n)=>{
    L.push(`### ${nodeNo(n.id)}. ${n.key?`『${n.title||'無題'}』`:(n.title||'無題')}${n.id===p.startId?'（開始）':''}${n.type==='ending'?`【${END_KINDS[n.endKind]?END_KINDS[n.endKind]+'エンド':'エンディング'}】`:''}`);
    if(n.place&&placeById(n.place)) L.push(`*場所：${placeById(n.place).name}*`);
    if(n.effects.length) L.push(`*${g?'起きること':'入ったとき'}：${n.effects.map(fmtEff).join('、')}*`);
    if(n.text) L.push('',n.text);
    if(n.gm) L.push('',`> ${g?'作者メモ':'GMメモ'}：${n.gm.replace(/\n/g,'\n> ')}`);
    if(n.choices.length&&n.type!=='ending'){ L.push(''); for(const c of n.choices){
      let s=`- 「${c.label||'無題'}」`;
      if(c.kind==='check'){
        s+=` 判定 ${c.dice} ${c.cmp==='<='?'≦':'≧'} ${c.target} → 成功：${nodeName(c.okTo)}／失敗：${nodeName(c.ngTo)}`;
        if(c.cf){ const le=c.cmp==='<='; s+=`／クリティカル（${le?'≦':'≧'}${c.critVal}）：${c.critTo?nodeName(c.critTo):'成功と同じ'}／ファンブル（${le?'≧':'≦'}${c.fumVal}）：${c.fumTo?nodeName(c.fumTo):'失敗と同じ'}`; }
      } else s+=` → ${nodeName(c.to)}`;
      const ex=[]; if(c.conds.length) ex.push((g?'解禁：':'条件：')+c.conds.map(fmtCond).join('、')+(c.lock==='hide'?'（満たすまで隠す）':'')); if(c.effects.length) ex.push((g?'起きること：':'変化：')+c.effects.map(fmtEff).join('、'));
      if(ex.length) s+=`（${ex.join('／')}）`; L.push(s);
    }}
    L.push('');
  };
  if(p.chapters.length){
    p.chapters.forEach((c,i)=>{ const ns=ordered.filter(n=>n.chapter===c.id); if(!ns.length) return; L.push(`## 第${i+1}章 ${c.title||'無題の章'}`,''); ns.forEach(scene); });
    const free=ordered.filter(n=>!p.chapters.some(c=>c.id===n.chapter)); if(free.length){ L.push('## 章なし',''); free.forEach(scene); }
  }else{ L.push('## シーン',''); ordered.forEach(scene); }
  return L.join('\n');
}

/* ---------- ティラノスクリプト（.ks）書き出し ----------
   場面→ラベル（*s1）、本文→テキスト、選択肢→[glink]、値→ゲーム変数 f['名前']、条件→[if]、判定→乱数で分岐。
   GMメモ・作者メモは「;」のコメントとして残す。新規プロジェクトの data/scenario/scene1.ks と置きかえて使う想定 */
function toTyrano(){
  const p=P(); const L=[]; const lab=(id)=>'*s'+nodeNo(id);
  const q=(t)=>String(t).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const key=(id)=>{ const r=refOf(id); if(!r) return null; return r.type==='place'?`f['@場所:${q(r.name)}']`:`f['${q(r.name)}']`; };
  const attr=(t)=>String(t||'').replace(/"/g,'”').replace(/[\[\]]/g,'');
  const tgt=(t)=>{ const s=String(t??'').trim(); if(s!==''&&!isNaN(+s)) return String(+s); const v=P().vars.find(x=>x.name===s); return v?`f['${q(v.name)}']`:'0'; };
  const cond=(c)=>{ const k=key(c.var); if(!k) return 'false'; const y=+c.val||0;
    switch(c.op){case 'visited':case 'has':return `(${k}||0)>=1`; case 'notvisited':case 'none':return `(${k}||0)<=0`; case 'on':return `${k}`; case 'off':return `!${k}`; case '==':return `${k}==${y}`; case '!=':return `${k}!=${y}`; default:return `(${k}||0)${c.op}${y}`;} };
  const eff=(e)=>{ const k=key(e.var); if(!k) return ''; const n=+e.val||0;
    return ({set:`${k}=${n}`,add:`${k}=(${k}||0)+${n}`,sub:`${k}=(${k}||0)-${n}`,on:`${k}=1`,off:`${k}=0`})[e.op]||''; };
  const effs=(list)=>{ const x=list.map(eff).filter(Boolean); return x.length?[`[eval exp="${x.join('; ')}"]`]:[]; };
  const text=(t)=>{ const out=[]; const lines=String(t||'').split('\n');
    lines.forEach((ln,i)=>{
      let s=ln.replace(/\[/g,'[[').replace(/\{([^{}]+)\}/g,(m,nm)=>{ const v=P().vars.find(x=>x.name===nm); if(!v) return m; return v.type==='flag'?`[emb exp="f['${q(nm)}']?'ON':'OFF'"]`:`[emb exp="f['${q(nm)}']"]`; });
      if(/^[;*@#]/.test(s)) s=`[emb exp="'${s[0]}'"]`+s.slice(1);
      if(s.trim()==='') { out.push('[r]'); return; }
      out.push(s+(i<lines.length-1?'[l][r]':'[p]'));
    });
    return out; };
  L.push(`; ===== ${p.title||'無題'} =====`,
    '; ゲームブック工房から書き出したティラノスクリプト用シナリオです。',
    '; 使い方：ティラノスクリプトの新規プロジェクトの data/scenario/scene1.ks を、このファイルと置きかえてください。',

    '; 条件を満たしていない選択肢は表示されません。',
    '');
  L.push('*start','[cm]','[clearfix]','[start_keyconfig]','[menubutton]',
    '[position layer="message0" left=160 top=500 width=1000 height=200 page=fore visible=true]',
    '[position layer=message0 page=fore margint="45" marginl="50" marginr="70" marginb="60"]',
    '[layopt layer=message0 visible=true]',
    '[iscript]',
    "window.gbRoll=function(e){var s=String(e||'1d100').toLowerCase().replace(/\\s/g,''),t=0,m,re=/([+-]?)(\\d*d\\d+|\\d+)/g;while((m=re.exec(s))){var g=m[1]=='-'?-1:1;if(m[2].indexOf('d')>=0){var a=m[2].split('d'),n=+(a[0]||1),f=+a[1];for(var i=0;i<n;i++)t+=g*(1+Math.floor(Math.random()*f));}else t+=g*(+m[2]);}return t;};",
    '[endscript]');
  const init=p.vars.map(v=>`f['${q(v.name)}']=${+v.init||0}`).concat((p.places||[]).map(x=>`f['@場所:${q(x.name)}']=0`));
  if(init.length) L.push(`[eval exp="${init.join('; ')}"]`);
  L.push(`[jump target="${nodeById(p.startId)?lab(p.startId):'*s1'}"]`,'');
  const W=640, X=(1280-W)/2;
  p.nodes.forEach(n=>{
    const no=nodeNo(n.id);
    L.push(`; ----- ${no}. ${n.title||'無題'}${n.type==='ending'?'（エンディング）':''} -----`, lab(n.id), '[cm]');
    if(n.gm) n.gm.split('\n').forEach(x=>L.push('; '+(isGame()?'作者メモ':'GMメモ')+'：'+x));
    if(n.place&&placeById(n.place)) L.push(`[eval exp="f['@場所:${q(placeById(n.place).name)}']=(f['@場所:${q(placeById(n.place).name)}']||0)+1"]`);
    L.push(...effs(n.effects));
    L.push(...text(n.text||'……'));
    if(n.type==='ending'){
      L.push('— END —[p]',`[glink color="blue" text="最初から" x=${X} y=300 width=${W} size=24 target="*start"]`,'[s]','');
      return;
    }
    if(!n.choices.length){ L.push('; 選択肢がありません','[s]',''); return; }
    n.choices.forEach((c,i)=>{
      const y=120+i*80; const g=`[glink color="blue" text="${attr(c.label||'次へ')}" x=${X} y=${y} width=${W} size=24 target="*s${no}_c${i+1}"]`;
      if(c.conds.length) L.push(`[if exp="${c.conds.map(cond).join(' && ')}"]`,g,'[endif]'); else L.push(g);
    });
    L.push('[s]','');
    n.choices.forEach((c,i)=>{
      L.push(`*s${no}_c${i+1}`,'[cm]',...effs(c.effects));
      if(c.kind==='check'){
        const le=c.cmp==='<='; const T=tgt(c.target); const go=(to)=>nodeById(to)?`[jump target="${lab(to)}"]`:'[s]';
        L.push(`[eval exp="tf.gb_r=gbRoll('${q(c.dice||'1d100')}')"]`,
          `${attr(c.label||'判定')}：${String(c.dice||'1d100').toUpperCase()} → [emb exp="tf.gb_r"]（目標 ${le?'≦':'≧'} [emb exp="${T}"]）[p]`);
        if(c.cf&&c.critVal!==''){ L.push(`[if exp="tf.gb_r${le?'<=':'>='}${+c.critVal||0}"]`,'クリティカル！[p]',go(c.critTo||c.okTo),'[endif]'); }
        if(c.cf&&c.fumVal!==''){ L.push(`[if exp="tf.gb_r${le?'>=':'<='}${+c.fumVal||0}"]`,'ファンブル……[p]',go(c.fumTo||c.ngTo),'[endif]'); }
        L.push(`[if exp="tf.gb_r${le?'<=':'>='}${T}"]`,'成功[p]',go(c.okTo),'[else]','失敗[p]',go(c.ngTo),'[endif]','');
      }else{
        L.push(nodeById(c.to)?`[jump target="${lab(c.to)}"]`:'; 行き先が未設定です\n[s]','');
      }
    });
  });
  return L.join('\n');
}

/* ---------- 文字数とプレイ時間の目安 ---------- */
const READ_CPM=500; // 1分に読む文字数の目安
function textLen(t){ return String(t||'').replace(/\{[^{}]+\}/g,'00').replace(/\s/g,'').length; }
function nodeLen(n){ return textLen(n.text)+n.choices.reduce((a,c)=>a+textLen(c.label),0); }
function textStats(){
  const p=P(); const total=p.nodes.reduce((a,n)=>a+nodeLen(n),0);
  // 開始から各エンディングまでの、いちばん短い道のり（文字数）
  const dist={}; const st=p.startId; const q=[];
  if(nodeById(st)){ dist[st]=nodeLen(nodeById(st)); q.push(st); }
  while(q.length){ q.sort((a,b)=>dist[a]-dist[b]); const id=q.shift(); const n=nodeById(id); if(!n) continue;
    for(const c of n.choices) for(const t of targetsOf(c)){ const m=nodeById(t); if(!m) continue; const d=dist[id]+nodeLen(m); if(dist[t]===undefined||d<dist[t]){ dist[t]=d; q.push(t); } } }
  const ends=p.nodes.filter(n=>n.type==='ending').map(n=>({n,len:dist[n.id]})).filter(x=>x.len!==undefined).sort((a,b)=>a.len-b.len);
  return {total,ends,scenes:p.nodes.length};
}
const fmtMin=(chars)=>{ const m=Math.max(1,Math.round(chars/READ_CPM)); return m<60?`約${m}分`:`約${Math.floor(m/60)}時間${m%60?m%60+'分':''}`; };
function statsCard(){
  const st=textStats();
  return h('div',{class:'excard'},
    h('h3',{},'文字数と読む時間の目安'),
    h('div',{class:'stgrid'},
      h('div',{},h('span',{},'全体の文字数'),h('b',{},st.total.toLocaleString()+'字')),
      h('div',{},h('span',{},'全部読むと'),h('b',{},fmtMin(st.total))),
      h('div',{},h('span',{},'場面'),h('b',{},st.scenes+'')),
      h('div',{},h('span',{},'いちばん短いルート'),h('b',{},st.ends.length?fmtMin(st.ends[0].len):'—'))),
    st.ends.length?h('div',{class:'stends'},st.ends.map(x=>h('div',{},h('span',{},nodeName(x.n.id)),h('span',{class:'hint'},`最短 ${x.len.toLocaleString()}字・${fmtMin(x.len)}`)))):h('p',{class:'hint'},'開始からたどり着けるエンディングがまだありません。'),
    h('p',{class:'hint',style:'margin:10px 0 0'},`1分に${READ_CPM}字読むとしたときの目安です。TRPGでは、会話や判定のぶん実際のセッションはこの数倍かかります。`));
}

  const md=toMarkdown(); const js=JSON.stringify(P(),null,1);
  body.append(h('div',{class:'main'},h('div',{class:'scroll'},h('div',{class:'wrap'},
    h('h2',{class:'h2'},'書き出し'),
    metaCard(),
    statsCard(),
    playableCard(),
    tyranoCard(),
    docCard(),
    h('p',{class:'desc'},'全体をテキスト（Markdown）にまとめます。TALTOなどの投稿サイトに貼ったり、執筆用の下書きにしたりできます。'),
    h('div',{class:'row',style:'margin-bottom:8px'},h('b',{style:'flex:1'},'本文（Markdown）'),h('button',{class:'btn sm pri',onclick:()=>copyText(md)},'コピー')),
    h('textarea',{class:'code',readonly:true,value:md}),
    h('div',{class:'row',style:'margin:24px 0 8px'},h('b',{style:'flex:1'},'バックアップ用データ（JSON）'),h('button',{class:'btn sm',onclick:()=>downloadText(safeFileName(P().title).replace(/\.html$/,'.json'),js,'application/json')},NATIVE?'ファイルで送る':'ファイルに保存'),h('button',{class:'btn sm',onclick:()=>copyText(js)},'コピー')),
    h('p',{class:'hint',style:'margin:0 0 8px'},'コピーしてメモ等に保存しておけば、一覧画面の「JSONを読み込む」で復元できます。'),
    h('textarea',{class:'code',readonly:true,style:'min-height:160px',value:js})
  ))));
}

/* ---------- samples ---------- */
const mkV=(p)=>(name,type,init,memo,max)=>{ const v={id:rid('v'),name,type,init:String(init),memo,meter:!!max,max:String(max||10)}; p.vars.push(v); return v.id; };
const mkN=(title,type,text,gm)=>({id:rid('n'),title,type,x:0,y:0,text,gm:gm||'',effects:[],choices:[],chapter:'',endKind:''});
const mkCh=(p,title,nodes)=>{ const c={id:rid('h'),title}; p.chapters.push(c); nodes.forEach(n=>n.chapter=c.id); };
const mkC=(o)=>Object.assign(newChoice(),o);
function sampleTrpg(){
  const p=newProject('霧の洋館（サンプル）'); p.sample=true; const V=mkV(p), N=mkN, C=mkC;
  const san=V('SAN','num',50,'正気度。地下の扉の判定に使う',99), key=V('鍵','flag',0,'地下室の鍵を持っているか'); V('目星','num',60,'探索技能');
  const hall=N('玄関ホール','scene','霧の夜。あなたは古い洋館の扉を押し開けた。\n埃っぽい空気の向こうに、書斎への廊下と、地下へ続く階段が見える。\n\n（現在のSAN：{SAN}）','執事の灰崎がどこからか見ている。');
  const study=N('書斎','scene','壁一面の本棚。机の上には書きかけの日記が開いたままになっている。','目星に成功すると、引き出しの二重底に気づく。');
  const found=N('真鍮の鍵','scene','引き出しの底板が外れ、小さな真鍮の鍵が転がり出た。');
  const miss=N('何も見つからない','scene','いくら探しても何も見つからない。ふと、背後で誰かの視線を感じた気がした。');
  const base=N('地下室の扉','scene','湿った石段を降りると、鉄の扉が待っていた。扉の向こうから、かすかに水音が聞こえる。','開けるにはSAN値で判定。失敗すると扉の向こうのものを直視してしまう。');
  const dawn=N('夜明け','ending','扉の奥にあったのは、ただの古い井戸だった。\n外に出ると、霧はすっかり晴れていた。');
  const mad=N('井戸の底','ending','水面に映ったのは、自分ではない何かの顔だった。');
  found.effects.push({var:key,op:'on',val:''});
  miss.effects.push({var:san,op:'sub',val:'3'});
  hall.choices.push(C({label:'書斎へ向かう',to:study.id}), C({label:'地下への階段を下りる',to:base.id,conds:[{var:key,op:'on',val:''}]}));
  study.choices.push(C({label:'机を調べる',icon:'search',kind:'check',dice:'1d100',cmp:'<=',target:'目星',okTo:found.id,ngTo:miss.id,cf:true,critVal:'5',fumVal:'96'}), C({label:'ホールに戻る',to:hall.id}));
  found.choices.push(C({label:'ホールに戻る',to:hall.id}));
  miss.choices.push(C({label:'もう一度調べる',to:study.id}), C({label:'ホールに戻る',to:hall.id}));
  base.choices.push(C({label:'扉を開ける',key:true,kind:'check',dice:'1d100',cmp:'<=',target:'SAN',okTo:dawn.id,ngTo:mad.id,cf:true,critVal:'5',fumVal:'96'}), C({label:'引き返す',to:hall.id}));
  p.nodes=[hall,study,found,miss,base,dawn,mad]; p.startId=hall.id; base.key=true;
  dawn.endKind='good'; mad.endKind='bad';
  const PL=(name,memo,ns)=>{ const x={id:rid('l'),name,memo}; p.places.push(x); ns.forEach(n=>n.place=x.id); return x.id; };
  PL('玄関ホール','吹き抜けの広いホール。大きな柱時計が止まっている。',[hall]);
  const stP=PL('書斎','壁一面の本棚と、書きかけの日記が置かれた机。',[study,found,miss]);
  PL('地下室','湿った石段の先にある鉄の扉。水音が聞こえる。',[base,dawn,mad]);
  hall.choices[1].conds.push({var:'pl:'+stP,op:'visited',val:'1'});
  mkCh(p,'洋館の探索',[hall,study,found,miss]); mkCh(p,'地下へ',[base,dawn,mad]);
  p.npcs.push({id:rid('c'),name:'灰崎',role:'洋館の執事',memo:'無口。客を地下へ近づけたがらない。'});
  p.handouts.push({id:rid('o'),title:'HO1 探偵',to:'PC1',when:'導入時',body:'あなたは失踪した洋館の主人を探すよう依頼された探偵だ。\n主人は「地下の井戸を見てはいけない」と書き残していた。'});
  return p;
}
function sampleGame(){
  const p=newProject('放課後の図書室（サンプル）'); p.sample=true; p.mode='game'; const V=mkV(p), N=mkN, C=mkC;
  const key=V('古い鍵','item',0,'書庫の奥の扉が開く'), light=V('懐中電灯','item',1,'暗い場所を照らせる。電池は一回分');
  const think=V('推理','skill',1,'手がかりから真相に迫る。使うと減る');
  const secret=V('先生の秘密を知った','flag',0,'司書の先生から昔話を聞くとON');
  const like=V('先生の好感度','num',0,'話しかけるたびに上がる',5);
  const found=V('小さな扉を見つけた','flag',0,'一度照らして見つければ、暗くても扉まで行ける');
  const lib=N('図書室','scene','放課後、誰もいない図書室。\n奥の書庫の扉が、少しだけ開いている。');
  const dark=N('暗い書庫','scene','書庫の中は真っ暗だ。古い紙のにおいがする。');
  const teacher=N('司書の先生','scene','カウンターの奥で、司書の先生が本を修理している。「あら、まだ残ってたの」');
  const story=N('先生の昔話','scene','「書庫の奥にはね、昔の生徒が残した部屋があるの」\n先生は引き出しから古い鍵を取り出して、あなたに渡した。','好感度が2以上で聞ける。');
  const lit=N('光の先','scene','懐中電灯で照らすと、本棚の裏に小さな扉が見えた。鍵がかかっている。\n（推理はあと {推理} 回使える）');
  const fall=N('本の雪崩','scene','手探りで進んだら、積まれた本を崩してしまった。これ以上は進めそうにない。');
  const think1=N('扉の傷','scene','鍵穴のまわりの傷が新しい。最近だれかが開けている……先生なら何か知っているかもしれない。');
  const room=N('隠し部屋','scene','扉の向こうは小さな部屋だった。机の上に、一冊の日記が置かれている。');
  const endA=N('約束の日記','ending','日記の最後のページには、先生の名前があった。\nあの人はずっと、ここで誰かを待っていたのだ。');
  const endB=N('閉じた扉','ending','日記には手を触れず、そっと扉を閉めた。\n秘密は、秘密のままにしておこう。');
  teacher.effects.push({var:like,op:'add',val:'1'});
  story.effects.push({var:secret,op:'on',val:''},{var:key,op:'add',val:'1'});
  lit.effects.push({var:found,op:'on',val:''});
  lib.choices.push(C({label:'書庫に入る',to:dark.id}), C({label:'司書の先生に話しかける',to:teacher.id,icon:'talk'}));
  dark.choices.push(C({label:'懐中電灯で照らす',icon:'search',to:lit.id,conds:[{var:light,op:'has',val:'1'}],effects:[{var:light,op:'sub',val:'1'}]}), C({label:'見つけた扉へ向かう',to:lit.id,conds:[{var:found,op:'on',val:''}],lock:'hide'}), C({label:'手探りで進む',to:fall.id}));
  fall.choices.push(C({label:'図書室に戻る',to:lib.id}));
  teacher.choices.push(C({label:'書庫のことを聞く',icon:'talk',key:true,to:story.id,conds:[{var:like,op:'>=',val:'2'}]}), C({label:'図書室に戻る',to:lib.id}));
  story.choices.push(C({label:'図書室に戻る',to:lib.id}));
  lit.choices.push(C({label:'古い鍵で開ける',to:room.id,conds:[{var:key,op:'has',val:'1'}],effects:[{var:key,op:'sub',val:'1'}]}),
    C({label:'扉を推理する',icon:'search',to:think1.id,conds:[{var:think,op:'has',val:'1'}],effects:[{var:think,op:'sub',val:'1'}]}),
    C({label:'引き返す',to:lib.id}));
  think1.choices.push(C({label:'図書室に戻る',to:lib.id}));
  room.choices.push(C({label:'日記を読む',key:true,icon:'choice',to:endA.id,conds:[{var:secret,op:'on',val:''}]}), C({label:'何も見なかったことにする',icon:'choice',to:endB.id}));
  p.nodes=[lib,dark,teacher,story,lit,fall,think1,room,endA,endB]; p.startId=lib.id; room.key=true; story.key=true;
  endA.endKind='true'; endB.endKind='normal';
  const PL=(name,memo,ns)=>{ const x={id:rid('l'),name,memo}; p.places.push(x); ns.forEach(n=>n.place=x.id); return x.id; };
  PL('図書室','放課後の静かな図書室。カウンターに司書の先生がいる。',[lib,teacher,story]);
  const shoko=PL('書庫','古い本が積まれた暗い部屋。',[dark,fall,lit,think1]);
  PL('隠し部屋','書庫の奥、本棚の裏にある小さな部屋。',[room,endA,endB]);
  teacher.choices[0].conds.push({var:'pl:'+shoko,op:'visited',val:'1'});
  mkCh(p,'放課後',[lib,dark,teacher,story,fall]); mkCh(p,'書庫の奥',[lit,think1,room,endA,endB]);
  p.npcs.push({id:rid('c'),name:'司書の先生',role:'図書室の主',memo:'穏やか。昔この学校の生徒だった。'});
  return p;
}
